name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install ".[dev]"
      - name: Command line
        run: |
          altharm --help
          altharm tests/data/qe_cr2seas_sm24/data-file-schema.xml
      - name: Tests
        run: |
          set +e
          pytest -q -rfE 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) " pytest.log | head -20 | while read -r line; do echo "::error::${line:0:300}"; done
          exit $status
