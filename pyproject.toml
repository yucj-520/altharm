[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "altharm"
version = "0.0.1"
description = "Angular harmonics of altermagnetic spin splitting, direct from plane-wave DFT"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "spglib>=2.0",
    "ase>=3.22",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
plot = ["matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["altharm"]
